name: Refresh profile visuals

on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/render_activity.py'
      - 'scripts/render_header.py'
      - 'scripts/render_terminal.py'
      - 'scripts/validate_profile.py'
      - 'tests/**'
      - 'README.md'

concurrency:
  group: profile-visuals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate profile header
        run: python3 scripts/render_header.py

      - name: Generate ASCII terminal artwork
        run: python3 scripts/render_terminal.py

      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate language statistics and toolkit badges
        uses: seijikohara/profile-cards-action@ae2000130dd7676ce46b1109daa0b6fe8a6d921c # v1.17.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: languages
          output-dir: assets
          themes: light,dark
          palette: purple
          language-limit: '6'
          commit: 'false'
          badges: |
            Java
            Spring
            TypeScript
            Angular
            React
            Python
            PostgreSQL
            MySQL
            Docker
            Git

      - name: Generate skyline, streaks and snake from the public calendar
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          SNAKE_SEED: ${{ github.run_id }}
        run: python3 scripts/render_activity.py

      - name: Validate every README image and generated artifact
        run: python3 scripts/validate_profile.py

      - name: Commit updated visuals
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh statistics and animations [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
