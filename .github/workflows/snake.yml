name: Refresh profile visuals

on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

concurrency:
  group: profile-visuals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate profile statistics and contribution skyline
        uses: seijikohara/profile-cards-action@ae2000130dd7676ce46b1109daa0b6fe8a6d921c # v1.17.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          palette: purple
          language-limit: '6'
          commit: 'false'
          badges: |
            Java
            Spring
            TypeScript
            Angular
            React
            Python
            PostgreSQL
            MySQL
            Docker
            Git

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.dark.svg?palette=github-dark&color_snake=%23b99cff&color_dots=%23161b22,%23312a49,%235e438e,%238764c0,%23b99cff
            assets/snake.light.svg?palette=github&color_snake=%237044c6&color_dots=%23ebedf0,%23e2d4f4,%23b99cde,%23936ec8,%237044c6

      - name: Validate generated SVGs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for card in ('overview', 'contributions', 'languages', 'snake'):
              for theme in ('light', 'dark'):
                  path = Path('assets') / f'{card}.{theme}.svg'
                  root = ET.parse(path).getroot()
                  assert root.tag == '{http://www.w3.org/2000/svg}svg', path
          PY

      - name: Commit updated visuals
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh statistics and animations [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
